[package]
name = "jogga-ui-demo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-logger = "0.7"
tracing = "0.1"
jogga-ui = { path = ".." }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
