[package]
name = "jogga-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
path = "src/lib.rs"

[features]
fullstack = ["dioxus/fullstack"]

[dependencies]
base64 = "0.22"
dioxus = { version = "0.7", features = ["router"] }
dioxus-icons = { version = "0.1.0", default-features = false }
tracing = "0.1"
dioxus-leaflet = { git = "https://github.com/jogga-fit/dioxus-leaflet", branch = "main" }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
ammonia = "4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel      = "0.3"
gloo-timers          = { version = "0.3", features = ["futures"] }
js-sys               = "0.3"
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Blob", "CanvasRenderingContext2d",
    "Document", "Element",
    "File", "FileList",
    "HtmlCanvasElement", "HtmlInputElement",
    "ImageBitmap",
    "Navigator",
    "Url", "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
todo = "warn"
